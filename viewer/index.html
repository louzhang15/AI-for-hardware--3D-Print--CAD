<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wiremap</title>
  <meta name="description" content="Wiremap: see, check and build your hardware project step by step.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232454ca'/%3E%3Cpath d='M8 22h6l4-12h6M8 13h3m10 6h3' fill='none' stroke='%23fff' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='8' cy='22' r='2' fill='%23fff'/%3E%3Ccircle cx='24' cy='10' r='2' fill='%23fff'/%3E%3C/svg%3E">
  <script>
    // Apply the saved theme before first paint (no flash).
    try {
      var t = JSON.parse(localStorage.getItem('wiremap:theme') || 'null');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      var m = JSON.parse(localStorage.getItem('wiremap:reduceMotion') || 'null');
      if (m === true) document.documentElement.dataset.motion = 'reduce';
    } catch (e) { /* storage blocked */ }
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./sketch.css">
  <link rel="stylesheet" href="./home.css">
  <link rel="stylesheet" href="./motion-preview.css">
  <link rel="stylesheet" href="./pinout.css">
  <link rel="stylesheet" href="./mechanics.css">
  <link rel="stylesheet" href="./overlay.css">
  <link rel="stylesheet" href="./alternatives.css">
  <link rel="stylesheet" href="./pin-edit.css">
</head>
<body>
  <div id="banner" role="alert" hidden></div>
  <div id="app">
    <div class="boot">
      <div class="boot-logo"></div>
      <p>Loading Wiremap…</p>
    </div>
  </div>
  <noscript><p class="noscript">Wiremap needs JavaScript to draw your circuit.</p></noscript>
  <script type="module">
    import('./app.js').catch(function (e) {
      var b = document.getElementById('banner');
      b.hidden = false;
      b.textContent = 'The viewer failed to start: ' + (e && e.message ? e.message : e) + '. Make sure you opened it through node viewer/serve.mjs.';
    });
  </script>
</body>
</html>
